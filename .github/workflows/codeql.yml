# CodeQL Security Analysis for AWMusic Monorepo
#
# Analyzes TypeScript/JavaScript (React Native, Tauri frontend, Astro),
# Python (documentation scripts), and Rust (Tauri backend) code for security vulnerabilities.
#
name: "CodeQL Advanced"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Run weekly on Wednesday at 1:36 AM UTC
    - cron: "36 1 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'rust' && 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read
      # Only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # TypeScript/JavaScript analysis for React Native, Tauri frontend, Astro website
          - language: javascript-typescript
            build-mode: none
            paths: |
              packages/mobile/**
              packages/desktop/src/**
              packages/website/**
              packages/shared/**
              packages/api/**

          # Python analysis for documentation and utility scripts
          - language: python
            build-mode: none
            paths: |
              scripts/**

          # Rust analysis for Tauri desktop backend
          - language: rust
            build-mode: manual
            paths: |
              packages/desktop/src-tauri/**

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup Node.js for TypeScript/JavaScript analysis
      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
          run_install: false

      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile

      # Setup Python for Python analysis
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Setup Rust for Tauri analysis
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Enable security-extended queries for comprehensive analysis
          queries: security-extended,security-and-quality

      # Manual build step for Rust (Tauri)
      - name: Build Rust (Tauri)
        if: matrix.build-mode == 'manual' && matrix.language == 'rust'
        working-directory: packages/desktop/src-tauri
        run: |
          cargo build --release

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload: true

      # Upload SARIF results as artifact for review
      - name: Upload SARIF results
        if: always()
        uses: github/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: ../results/*.sarif
          retention-days: 5
